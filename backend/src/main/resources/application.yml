server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: haribhakthi-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:haribhakthi_sara}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

app:
  admin:
    email: ${ADMIN_EMAIL:admin@haribhakthi.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@123}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    base-path: ${MEDIA_STORAGE_PATH:/var/haribhakthi_media_storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
