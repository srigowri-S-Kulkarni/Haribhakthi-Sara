server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: haribhakthi-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:haribhakthi_sara}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

app:
  storage:
    base-path: ${MEDIA_STORAGE_PATH:C:/haribhakthi_media_storage}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
    expiration-ms: 86400000 # 24 hours
